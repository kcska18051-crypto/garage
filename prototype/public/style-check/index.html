<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Главная — стайл-чек «Гараж»</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const source = new URL('../', window.location.href)
      const response = await fetch(source, { cache: 'no-store' })
      if (!response.ok) throw new Error('Не удалось загрузить исходную страницу')
      const documentSource = new DOMParser().parseFromString(await response.text(), 'text/html')
      for (const link of documentSource.querySelectorAll('link[rel="stylesheet"], link[rel="modulepreload"]')) {
        const copy = document.createElement('link')
        for (const attribute of link.attributes) copy.setAttribute(attribute.name, attribute.value)
        copy.href = new URL(link.getAttribute('href'), response.url).href
        document.head.append(copy)
      }
      const styleCheck = document.createElement('link')
      styleCheck.rel = 'stylesheet'
      styleCheck.href = '/garage/style-check/style-v3.css?v=20261027-geometry'
      await new Promise((resolve) => {
        styleCheck.onload = resolve
        styleCheck.onerror = resolve
        document.head.append(styleCheck)
      })
      const headerStyle = document.createElement('link')
      headerStyle.rel = 'stylesheet'
      headerStyle.href = '/garage/style-check/header-iteration-1.css?v=20261027-actions-services'
      await new Promise((resolve) => {
        headerStyle.onload = resolve
        headerStyle.onerror = resolve
        document.head.append(headerStyle)
      })
      const artDirection = document.createElement('link')
      artDirection.rel = 'stylesheet'
      artDirection.href = '/garage/style-check/art-direction-header.css?v=20261027-approved-image'
      await new Promise((resolve) => {
        artDirection.onload = resolve
        artDirection.onerror = resolve
        document.head.append(artDirection)
      })
      const homepageVisualReview = document.createElement('link')
      homepageVisualReview.rel = 'stylesheet'
      homepageVisualReview.href = '/garage/style-check/homepage-visual-review.css?v=20261027-local-1'
      await new Promise((resolve) => {
        homepageVisualReview.onload = resolve
        homepageVisualReview.onerror = resolve
        document.head.append(homepageVisualReview)
      })
      const revisionTwo = document.createElement('link')
      revisionTwo.rel = 'stylesheet'
      revisionTwo.href = '/garage/style-check/homepage-review-v2.css?v=20261027-2'
      await new Promise((resolve) => {
        revisionTwo.onload = resolve
        revisionTwo.onerror = resolve
        document.head.append(revisionTwo)
      })
      const revisionThree = document.createElement('link')
      revisionThree.rel = 'stylesheet'
      revisionThree.href = '/garage/style-check/homepage-review-v3.css?v=20261027-3'
      await new Promise(resolve => {
        revisionThree.onload = resolve
        revisionThree.onerror = resolve
        document.head.append(revisionThree)
      })
      const revisionFive = document.createElement('link')
      revisionFive.rel = 'stylesheet'
      revisionFive.href = '/garage/style-check/homepage-review-v5.css?v=20261027-10'
      await new Promise(resolve => { revisionFive.onload = resolve; revisionFive.onerror = resolve; document.head.append(revisionFive) })
      const headerReview = document.createElement('link')
      headerReview.rel = 'stylesheet'
      headerReview.href = '/garage/style-check/header-review-v11.css?v=20261028-13'
      await new Promise(resolve => { headerReview.onload = resolve; headerReview.onerror = resolve; document.head.append(headerReview) })
      const productScale = document.createElement('link')
      productScale.rel = 'stylesheet'
      productScale.href = '/garage/style-check/product-scale-v15.css?v=20261028-15'
      await new Promise(resolve => { productScale.onload = resolve; productScale.onerror = resolve; document.head.append(productScale) })
      const sourceScript = documentSource.querySelector('script[type="module"][src]')
      if (!sourceScript) throw new Error('Не найден скрипт прототипа')
      const script = document.createElement('script')
      script.type = 'module'
      script.src = new URL(sourceScript.getAttribute('src'), response.url).href
      document.body.append(script)
    </script>
  </body>
</html>
